<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e02e24">
  <meta name="description" content="拼多多风格分类页：蔬菜水果、手机数码、女装男装等 12 个分类。">
  <title>商品分类 · 拼多多简单版</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="category">
  <div class="app-shell">
    <header class="sub-header">
      <a class="round-btn" href="index.html" aria-label="返回首页">
        <svg class="icon" aria-hidden="true"><use href="images/icons.svg#arrow-left"></use></svg>
      </a>
      <h1>商品分类</h1>
      <button class="round-btn" type="button" data-open-search aria-label="搜索商品">
        <svg class="icon" aria-hidden="true"><use href="images/icons.svg#search"></use></svg>
      </button>
    </header>

    <main class="page category-page">
      <div class="category-layout">
        <aside class="cat-sidebar" id="catSidebar" aria-label="商品分类列表">
          <div class="sidebar-skeleton" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
        </aside>
        <section class="cat-content" id="catContent" aria-live="polite" aria-busy="true">
          <div class="content-skeleton" aria-hidden="true">
            <div class="skeleton-banner"></div>
            <div class="skeleton-line short"></div>
            <div class="skeleton-grid"><i></i><i></i><i></i><i></i><i></i><i></i></div>
            <div class="skeleton-line short"></div>
            <div class="skeleton-products"><i></i><i></i></div>
          </div>
          <noscript>
            <p class="noscript-tip">请开启 JavaScript 以查看分类商品。</p>
          </noscript>
        </section>
      </div>
    </main>

    <nav class="tabbar" aria-label="主导航">
      <a class="tab-item" href="index.html">
        <span class="tab-icon"><svg class="icon" aria-hidden="true"><use href="images/icons.svg#home"></use></svg></span>
        <span>首页</span>
      </a>
      <a class="tab-item active" href="category.html" aria-current="page">
        <span class="tab-icon"><svg class="icon" aria-hidden="true"><use href="images/icons.svg#grid"></use></svg></span>
        <span>分类</span>
      </a>
      <a class="tab-item" href="profile.html">
        <span class="tab-icon"><svg class="icon" aria-hidden="true"><use href="images/icons.svg#user"></use></svg></span>
        <span>个人中心</span>
      </a>
    </nav>
  </div>

  <script src="js/catalog.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
